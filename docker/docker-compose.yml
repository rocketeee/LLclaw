# LLclaw - OpenClaw Docker 部署配置
# 使用方法: docker compose up -d
# 文档: https://github.com/rocketeee/LLclaw

version: '3.8'

services:
  # OpenClaw Gateway 主服务
  openclaw:
    image: openclaw/openclaw:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    ports:
      - "${OPENCLAW_PORT:-18789}:18789"
    volumes:
      - ./config:/root/.openclaw
      - ./logs:/root/.openclaw/logs
      - ./data:/root/.openclaw/data
    environment:
      - NODE_ENV=production
      - OPENCLAW_PORT=18789
      - OPENCLAW_BIND=0.0.0.0
      - OPENCLAW_VERBOSE=${OPENCLAW_VERBOSE:-true}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - llclaw-network

  # Ollama 本地模型引擎（可选）
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-engine
    restart: unless-stopped
    profiles:
      - with-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - llclaw-network

  # vLLM 推理引擎（可选）
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-engine
    restart: unless-stopped
    profiles:
      - with-vllm
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - vllm-models:/root/.cache/huggingface
    environment:
      - MODEL_NAME=${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - llclaw-network

volumes:
  ollama-data:
    driver: local
  vllm-models:
    driver: local

networks:
  llclaw-network:
    driver: bridge
